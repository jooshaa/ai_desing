openapi: 3.1.0
info:
  title: Imora Auth API
  version: 0.1.0
  description: Core module — phone OTP, JWT, profile, addresses. Owner Jo'shqin.
servers:
  - url: http://localhost:3001/api
tags:
  - name: Auth
  - name: Profile
paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send SMS OTP to a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '+998901234567' }
      responses:
        '204': { description: OTP sent }
        '429':
          description: Too many attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: '123456' }
                name: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Invalid code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Logged out }
  /me:
    get:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /me/addresses:
    get:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, phone, role, isActive]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        name: { type: string, nullable: true }
        role:
          type: string
          enum: [user, store, admin]
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        region: { type: string }
        district: { type: string }
        text: { type: string }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
    AddressInput:
      type: object
      required: [region, district, text]
      properties:
        region: { type: string }
        district: { type: string }
        text: { type: string }
        lat: { type: number }
        lng: { type: number }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Error:
      type: object
      required: [statusCode, message, timestamp]
      properties:
        statusCode: { type: integer }
        message: { type: string }
        requestId: { type: string }
        path: { type: string }
        timestamp: { type: string, format: date-time }
