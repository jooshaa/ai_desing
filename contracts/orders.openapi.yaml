openapi: 3.1.0
info:
  title: Imora Orders API
  version: 0.1.0
  description: Orders + search — cart, checkout, status, price compare. Owner Shohjahon NT.
servers:
  - url: http://localhost:3001/api
tags:
  - name: Cart
  - name: Orders
  - name: Compare
  - name: StoreOrders
paths:
  /cart:
    get:
      tags: [Cart]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
  /cart/items:
    post:
      tags: [Cart]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, qty]
              properties:
                productId: { type: string, format: uuid }
                qty: { type: number }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
  /orders:
    get:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId]
              properties:
                addressId: { type: string, format: uuid }
                note: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{id}:
    get:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /products/{id}/offers:
    get:
      tags: [Compare]
      summary: Same product across stores, cheapest / nearest (AC-05)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: sort
          schema:
            type: string
            enum: [price, distance]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
  /store/orders:
    get:
      tags: [StoreOrders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /store/orders/{id}/status:
    patch:
      tags: [StoreOrders]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
                reason: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrderStatus:
      type: string
      enum: [NEW, CONFIRMED, PREPARING, DELIVERING, DELIVERED, CANCELLED]
    Cart:
      type: object
      properties:
        id: { type: string, format: uuid }
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        updatedAt: { type: string, format: date-time }
    CartItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        qty: { type: number }
        priceSnapshot: { type: number }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        addressId: { type: string, format: uuid }
        status:
          $ref: '#/components/schemas/OrderStatus'
        total: { type: number }
        note: { type: string, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        createdAt: { type: string, format: date-time }
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        qty: { type: number }
        price: { type: number }
        productNameSnapshot: { type: string }
    Offer:
      type: object
      properties:
        productId: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        price: { type: number }
        currency: { type: string }
        inStock: { type: boolean }
        distanceKm: { type: number, nullable: true }
    Error:
      type: object
      required: [statusCode, message, timestamp]
      properties:
        statusCode: { type: integer }
        message: { type: string }
        requestId: { type: string }
        path: { type: string }
        timestamp: { type: string, format: date-time }
