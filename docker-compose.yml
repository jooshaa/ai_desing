services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imora
      POSTGRES_PASSWORD: imora
      POSTGRES_DB: imora
    ports:
      - '5432:5432'
    volumes:
      - imora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imora -d imora']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - imora_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: imora
      MINIO_ROOT_PASSWORD: imora-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - imora_minio:/data

volumes:
  imora_pg:
  imora_redis:
  imora_minio:
